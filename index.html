    <style>

        .product-detail-modal.show { display: flex; }

        .product-detail-modal .modal-content .detail-desc { color: #aaa; margin: 10px 0; }

        .stat-card .stat-number { font-size: 2rem; font-weight: 900; color: #ffd700; }

        .ministry-card {

            border-radius: 12px;

        .ministry-card img {

            .bottom-nav a i { font-size: 1.2rem; }

<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginScreen" class="login-screen bg-main">
    <div class="content text-center">
        <img class="logo" src="https://cdn.discordapp.com/attachments/1259131362615492658/1536081187112616086/file_0000000075ec81f4a2f598e0a37d13f8.png?ex=6a7a1a96&is=6a78c916&hm=d5e9dba92e8f19f99c21d3f807a1acb9149689193411752f0dec9ed14585738c&" alt="Arab Land">
        <h1>ARAB LAND</h1>
        <p style="color:#ffd700;font-size:1.5rem;font-weight:700;">منجر متكامل لجميع احتياجاتك</p>
        <p style="color:#aaa;font-size:1.1rem;margin-bottom:20px;">سيرفر رول بلاي فريد من نوعه</p>

        <button class="login-btn" onclick="loginWithUsername()">🚀 دخول</button>
        <p style="color:#666;font-size:0.8rem;margin-top:20px;">ARAB-LAND.CC</p>
        <p style="color:#555;font-size:0.7rem;margin-top:5px;">انضم الآن وكن جزءاً من أفضل سيرفر عربي في عالم SAMP</p>

<!-- ===== الموقع الرئيسي ===== -->

    <div class="content">

                <button class="save-btn" onclick="saveOrderNumber()">💾 حفظ</button>

        </div>
        <div id="pageContent"></div>
        <nav class="bottom-nav" id="bottomNav">
            <a href="#" class="active" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="#" data-page="store"><i class="fas fa-store"></i><span>المتجر</span></a>
            <a href="#" data-page="jobs"><i class="fas fa-briefcase"></i><span>الوظائف</span></a>
            <a href="#" data-page="admin"><i class="fas fa-crown"></i><span>الإدارة</span></a>
            <a href="#" data-page="rules"><i class="fas fa-gavel"></i><span>القوانين</span></a>
            <a href="#" data-page="media"><i class="fas fa-photo-video"></i><span>الميديا</span></a>
            <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt" style="color:#ff0000;"></i><span style="color:#ff0000;">خروج</span></a>

<!-- ===== زر السلة ===== -->
<button class="cart-toggle" onclick="toggleCart()">
    🛒 <span class="badge" id="cartBadge">0</span>
</button>

<!-- ===== السلة الجانبية ===== -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3>🛒 سلة المشتريات</h3>
        <button onclick="toggleCart()" style="background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">✕</button>
    </div>
    <div id="cartItems"><p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p></div>
    <div class="cart-total" id="cartTotal">المجموع: 0 كريدت</div>
    <button onclick="checkout()" style="width:100%;background:#00ff00;color:#000;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:10px;">✅ إنهاء الطلب</button>
</div>

<!-- ===== نافذة تفاصيل المنتج ===== -->
<div class="product-detail-modal" id="productDetailModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeProductDetail()">✕</button>
        <img id="detailImage" src="" alt="">
        <h2 id="detailName" style="color:#fff;font-size:1.8rem;"></h2>
        <div class="detail-price" id="detailPrice"></div>
        <div class="detail-desc" id="detailDesc">وصف المنتج: منتج مميز وفاخر من Arab Land</div>
        <div class="quantity-control" style="display:flex;justify-content:center;align-items:center;gap:10px;margin:15px 0;">
            <button onclick="changeDetailQty(-1)">-</button>
            <span id="detailQty" style="font-size:1.5rem;font-weight:700;min-width:40px;text-align:center;">1</span>
            <button onclick="changeDetailQty(1)">+</button>
        </div>
        <button onclick="addDetailToCart()" style="width:100%;background:#ff0000;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;">➕ أضف للسلة</button>
    </div>
</div>

<script>
    // ===== المتغيرات العامة =====
    let currentOrderNumber = '';
    let cart = [];
    let cartCount = 0;
    let currentUser = '';
    let detailQty = 1;
    let detailProduct = null;
    let currentSubcategory = 'all';
    let currentCategory = 'realestate';
    let searchQuery = '';

    // ===== Webhook Discord =====
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1536050582245081228/kFbbq1v92r15IC92OlfAkXjXQODCGJ68d73Ztp56IUThZVN19UPgAYIclu9jTmN13M9d';

    // ===== دالة تحويل السعر من نص إلى رقم =====
    function parsePrice(priceStr) {
        if (!priceStr) return 0;
        let num = parseFloat(priceStr.replace(/[^0-9.]/g, ''));
        if (priceStr.includes('M')) return num * 1000000;
        if (priceStr.includes('K')) return num * 1000;
        return num;
    }

    // ===== دالة تحويل الرقم إلى نص مع K أو M =====
    function formatPrice(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
        return num.toString();

    // ===== دالة الدخول =====
    function loginWithUsername() {
        let username = document.getElementById('usernameInput').value.trim();
        if (username === '') {
            username = 'زائر';
            document.getElementById('usernameInput').value = 'زائر';
        }
        currentUser = username;
        try { localStorage.setItem('user', JSON.stringify({ username: username })); } catch(e) {}
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainSite').style.display = 'block';
        loadPage('home');
        showNotification('✅ مرحباً، ' + username + '!');
        storeStats.visitors++;
    }

    // ===== دالة الخروج =====
    function logout() {
        try { localStorage.removeItem('user'); } catch(e) {}
        currentUser = '';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainSite').style.display = 'none';
        document.getElementById('usernameInput').value = '';
    }

    function showOrderNumber(number) {

        try { localStorage.setItem('lastOrderNumber', number); } catch(e) {}

        if (currentOrderNumber) {
            try { localStorage.setItem('savedOrderNumber', currentOrderNumber); } catch(e) {}
            showNotification('✅ تم حفظ رقم الطلب: #' + currentOrderNumber);
        }
    }

        currentOrderNumber = '';
        document.getElementById('orderBar').classList.remove('show');
        try { localStorage.removeItem('lastOrderNumber'); } catch(e) {}
        showNotification('🗑️ تم إزالة رقم الطلب');

    // ===== إرسال إشعار Discord =====
    function sendDiscordNotification(orderData) {
        if (!WEBHOOK_URL) return;
        
        const embed = {
            title: '🛒 طلب جديد من المتجر',
            color: 0xff0000,
            fields: [
                { name: '👤 المشتري', value: orderData.username || 'زائر', inline: true },
                { name: '📋 رقم الطلب', value: `#${orderData.orderNumber}`, inline: true },
                { name: '📦 المنتجات', value: orderData.items || 'لا يوجد', inline: false },
                { name: '💰 المجموع', value: orderData.total || '0 كريدت', inline: true },
                { name: '📅 الوقت', value: new Date().toLocaleString('ar-EG'), inline: true }
            ],
            footer: { text: 'Arab Land Store' },
            timestamp: new Date().toISOString()
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(err => console.log('Webhook error:', err));
    }

    // ===== تحميل الصفحات =====
    function loadPage(page) {
        const content = document.getElementById('pageContent');
        const pages = { home: getHomePage, store: getStorePage, jobs: getJobsPage, admin: getAdminPage, rules: getRulesPage, media: getMediaPage };
        if (pages[page]) {
            content.innerHTML = pages[page]();
            document.querySelectorAll('.bottom-nav a[data-page]').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) link.classList.add('active');
            });
            if (page === 'store') setTimeout(() => { 
                updateCartUI(); 
                renderStore();
            }, 100);
        }
    }

    document.querySelectorAll('.bottom-nav a[data-page]').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            loadPage(this.dataset.page);
        });
    });

                <!-- عرض المنتجات -->
                <div id="storeProducts" class="product-grid"></div>
            </section>
        `;
    }

    // ===== اختيار القسم =====
    function selectCategory(category) {
        currentCategory = category;
        currentSubcategory = 'all';
        renderStore();
        showNotification('📂 تم اختيار قسم: ' + (category === 'realestate' ? 'العقارات' : category === 'packages' ? 'الحزم' : 'العصابات'));
    }

    // ===== البحث =====
    function updateSearch() {
        searchQuery = document.getElementById('searchInput')?.value?.trim().toLowerCase() || '';
        renderStore();
    }

    // ===== عرض المنتجات =====
    function renderStore() {
        const container = document.getElementById('storeProducts');
        const tabsContainer = document.getElementById('subcategoryTabs');
        if (!container) return;

        const categoryData = allProducts[currentCategory];
        if (categoryData && tabsContainer) {
            let tabsHtml = `<button class="active" onclick="setSubcategory('all', this)">الكل</button>`;
            categoryData.subcategories.forEach(sub => {
                tabsHtml += `<button onclick="setSubcategory('${sub}', this)">${sub}</button>`;
            });
            tabsContainer.innerHTML = tabsHtml;
        }

        let products = categoryData ? [...categoryData.items] : [];

        if (currentSubcategory !== 'all') {
            products = products.filter(p => p.subcategory === currentSubcategory);
        }

        if (searchQuery) {
            products = products.filter(p => p.name.toLowerCase().includes(searchQuery) || p.subcategory.includes(searchQuery));
        }

        if (products.length === 0) {
            container.innerHTML = `<p style="color:#666;text-align:center;padding:40px;font-size:1.2rem;">❌ لا توجد منتجات تطابق البحث</p>`;
            return;
        }

        let html = '';
        products.forEach(p => {
            html += `
                <div class="product-card" style="background-image:url('${p.img}'); position:relative; cursor:pointer;" onclick="openProductDetail('${p.id}')">
                    <h3>${p.name}</h3>
                    <div class="price">💰 ${p.price} كريدت</div>
                    <div class="quantity-control">
                        <button onclick="event.stopPropagation(); changeQty('${p.id}', -1)">-</button>
                        <span id="qty_${p.id}">1</span>
                        <button onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+</button>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation(); addToCartWithQty('${p.id}')">➕ أضف للسلة</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ===== الكميات المؤقتة =====
    const tempQtys = {};

    function changeQty(productId, delta) {
        if (!tempQtys[productId]) tempQtys[productId] = 1;
        tempQtys[productId] = Math.max(1, tempQtys[productId] + delta);
        const el = document.getElementById(`qty_${productId}`);
        if (el) el.textContent = tempQtys[productId];
    }

    function getQty(productId) {
        return tempQtys[productId] || 1;
    }

    function setSubcategory(sub, btn) {
        currentSubcategory = sub;
        document.querySelectorAll('.subcategory-tabs button').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderStore();
    }

    function addToCartWithQty(productId) {
        const categoryData = allProducts[currentCategory];
        const product = categoryData.items.find(p => p.id === productId);
        if (!product) return;
        const qty = getQty(productId);
        addToCart(product, qty);
    }

    // ===== تفاصيل المنتج =====
    function openProductDetail(productId) {
        const categoryData = allProducts[currentCategory];
        const product = categoryData.items.find(p => p.id === productId);
        if (!product) return;
        detailProduct = product;
        detailQty = 1;
        document.getElementById('detailImage').src = product.img;
        document.getElementById('detailName').textContent = product.name;
        document.getElementById('detailPrice').textContent = `💰 ${product.price} كريدت`;
        document.getElementById('detailDesc').textContent = product.desc || 'منتج مميز من Arab Land';
        document.getElementById('detailQty').textContent = 1;
        document.getElementById('productDetailModal').classList.add('show');
    }

    function closeProductDetail() {
        document.getElementById('productDetailModal').classList.remove('show');
    }

    function changeDetailQty(delta) {
        detailQty = Math.max(1, detailQty + delta);
        document.getElementById('detailQty').textContent = detailQty;
    }

    function addDetailToCart() {
        if (!detailProduct) return;
        addToCart(detailProduct, detailQty);
        closeProductDetail();
    }

    // ===== إضافة للسلة =====
    function addToCart(product, qty) {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
            existing.qty += qty;
        } else {
            cart.push({ ...product, qty: qty });
        }
        cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
        updateCartUI();
        showNotification('➕ تم إضافة ' + product.name + ' (x' + qty + ') للسلة');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
        updateCartUI();
    }

    // ===== تحديث واجهة السلة (المعدلة) =====
    function updateCartUI() {
        document.getElementById('cartBadge').textContent = cartCount;
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p>';
            document.getElementById('cartTotal').textContent = 'المجموع: 0 كريدت';
            return;
        }
        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
            const priceNum = parsePrice(item.price);
            const itemTotal = priceNum * item.qty;
            total += itemTotal;
            const priceDisplay = formatPrice(priceNum);
            const totalDisplay = formatPrice(itemTotal);
            html += `
                <div class="cart-item">
                    <div class="item-info">
                        <img src="${item.img}" alt="">
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-qty">الكمية: ${item.qty}</div>
                            <div style="color:#888;font-size:0.7rem;">السعر: ${priceDisplay} كريدت</div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="item-price">${totalDisplay} كريدت</span>
                        <button onclick="removeFromCart(${index})" style="background:#ff0000;color:#fff;border:none;border-radius:5px;padding:2px 10px;cursor:pointer;">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('cartTotal').textContent = 'المجموع: ' + formatPrice(total) + ' كريدت';
    }

    function toggleCart() {
        document.getElementById('cartSidebar').classList.toggle('open');
    }

    // ===== إنهاء الطلب مع إرسال Webhook =====
    function checkout() {
        if (cart.length === 0) { alert('السلة فارغة!'); return; }
        const orderNumber = Math.floor(Math.random() * 1000000);
        showOrderNumber(orderNumber);
        
        let total = 0;
        let itemsList = '';
        cart.forEach(item => {
            const priceNum = parsePrice(item.price);
            total += priceNum * item.qty;
            itemsList += `${item.name} (x${item.qty}) - ${item.price}\n`;
        });
        
        const orderData = {
            username: currentUser || 'زائر',
            orderNumber: orderNumber,
            items: itemsList || 'لا يوجد',
            total: formatPrice(total) + ' كريدت'
        };
        sendDiscordNotification(orderData);
        
        storeStats.sales += cart.reduce((sum, item) => sum + item.qty, 0);
        cart = [];
        cartCount = 0;
        updateCartUI();
        toggleCart();
        showNotification('✅ تم إنهاء الطلب بنجاح! رقم الطلب: #' + orderNumber);
    }

    // ===== صفحة القوانين =====
    function getRulesPage() {
        let lawsHtml = '';
        laws.forEach(section => {
            let rulesHtml = '';
            section.rules.forEach((rule, index) => {
                rulesHtml += `<div class="law-item"><strong>${index + 1}.</strong> ${rule}</div>`;
            });
            lawsHtml += `
                <div class="law-section">
                    <h3>📜 ${section.title}</h3>
                    ${rulesHtml}
                </div>
            `;
        });

        return `
            <section class="section">
                <h2 class="section-title">📜 قوانين السيرفر</h2>
                <div class="glass-card" style="max-width:900px;margin:0 auto;">
                    <p style="color:#ffd700;text-align:center;font-size:1.1rem;margin-bottom:20px;">يرجى قراءة القوانين بعناية قبل الانضمام</p>
                    <p style="color:#aaa;text-align:center;margin-bottom:20px;">الالتزام بالقوانين إلزامي لجميع اللاعبين.</p>
                    ${lawsHtml}
                    <div style="margin-top:20px;padding:15px;background:rgba(255,0,0,0.1);border-radius:10px;border:1px solid rgba(255,0,0,0.2);">
                        <h3 style="color:#ffd700;">⚠️ نظام الإنذارات</h3>
                        <div class="law-item"><strong>1.</strong> كل مخالفة قد تُفضي إلى إنذار يُسجل في ملف اللاعب.</div>
                        <div class="law-item"><strong>2.</strong> 3 إنذارات تراكمية تستوجب إيقافاً مؤقتاً.</div>
                        <div class="law-item"><strong>3.</strong> 5 إنذارات تراكمية قد تصل للحظر الدائم.</div>
                        <div class="law-item"><strong>4.</strong> يمكن الطعن في أي إنذار خلال 48 ساعة.</div>
                        <div class="law-item"><strong>5.</strong> المخالفات الخطيرة قد تؤدي إلى حظر فوري.</div>
                    </div>
                </div>
            </section>
        `;
    }

    // ===== قسم الوظائف (محدث) =====
    function getJobsPage() {
        let ministriesHtml = '';
        ministries.forEach(m => {
            ministriesHtml += `
                <div class="ministry-card">
                    <img src="${m.img}" alt="${m.name}" loading="lazy">
                    <h3>${m.name}</h3>
                    <div class="desc">${m.desc}</div>
                    <div class="closed">🔒 غير مفعل</div>
                </div>
            `;
        });

        return `
            <section class="section">
                <h2 class="section-title">💼 الوظائف والوزارات</h2>
                <div class="glass-card" style="max-width:1000px;margin:0 auto;text-align:center;">
                    <p style="font-size:1.2rem;color:#ffd700;">🏛️ وزارات الدولة</p>
                    <p style="color:#aaa;margin-bottom:15px;">انضم إلى إحدى الوزارات للمساهمة في تطوير السيرفر</p>
                    <div class="ministry-grid">
                        ${ministriesHtml}
                    </div>
                    <p style="color:#666;margin-top:20px;font-size:0.9rem;">⚠️ جميع الوزارات حالياً غير مفعلة - قريباً سيفتح باب التقديم</p>
                </div>
            </section>
        `;
    }

    // ===== الإدارة =====
    function getAdminPage() {
        return `
            <section class="section">
                <h2 class="section-title">👑 الإدارة</h2>
                <div class="admin-card" style="max-width:400px;margin:0 auto;">
                    <div class="rank">👑 ملك السيرفر</div>
                    <div class="name">CJ</div>
                    <p style="color:#aaa;font-size:0.9rem;">المؤسس والمدير العام</p>
                </div>
            </section>
        `;
    }

    // ===== الميديا =====
    function getMediaPage() {
        return `
            <section class="section">
                <h2 class="section-title">📸 الميديا</h2>
                <div class="glass-card" style="max-width:800px;margin:0 auto;text-align:center;">
                    <p style="color:#ffd700;font-size:1.3rem;">✅ قريباً - محتوى حصري من السيرفر</p>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-top:20px;">
                        <div style="background:rgba(255,0,0,0.2);border-radius:10px;padding:15px;">
                            <i class="fab fa-youtube" style="font-size:2rem;color:#ff0000;"></i>
                            <p style="color:#aaa;">يوتيوب</p>
                        </div>
                        <div style="background:rgba(255,0,0,0.2);border-radius:10px;padding:15px;">
                            <i class="fab fa-tiktok" style="font-size:2rem;color:#000;"></i>
                            <p style="color:#aaa;">تيك توك</p>
                        </div>
                        <div style="background:rgba(255,0,0,0.2);border-radius:10px;padding:15px;">
                            <i class="fab fa-instagram" style="font-size:2rem;color:#e4405f;"></i>
                            <p style="color:#aaa;">انستغرام</p>
                        </div>
                    </div>
                </div>
            </section>
        `;
    }

    // ===== الإشعارات =====
    function showNotification(msg) {
        const old = document.querySelector('.notification-toast');
        if (old) old.remove();
        const div = document.createElement('div');
        div.className = 'notification-toast';
        div.style.cssText = 'position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:12px 25px;border-radius:10px;border:1px solid #ff0000;z-index:2000;font-size:1rem;animation:fadeInUp 0.5s ease;';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => {
            div.style.animation = 'fadeOutDown 0.5s ease';
            setTimeout(() => div.remove(), 500);
        }, 3000);
    }

    // ===== عند تحميل الصفحة =====
    window.onload = function() {
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.username) {
                currentUser = user.username;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainSite').style.display = 'block';
                loadPage('home');
                storeStats.visitors++;
            }
        } catch(e) {}
    };
</script>
