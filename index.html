<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arab Land - البوابة الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background: #0a0000; color: #fff; min-height: 100vh; }
        
        .bg-main {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536081187112616086/file_0000000075ec81f4a2f598e0a37d13f8.png?ex=6a7a1a96&is=6a78c916&hm=d5e9dba92e8f19f99c21d3f807a1acb9149689193411752f0dec9ed14585738c&');
            background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh;
        }
        .bg-main::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 0; }
        .content { position: relative; z-index: 1; padding-bottom: 80px; }
        
        /* ===== شاشة تسجيل الدخول ===== */
        .login-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-screen .logo { width: 200px; height: 200px; border-radius: 50%; border: 3px solid #ff0000; box-shadow: 0 0 60px rgba(255,0,0,0.3); margin-bottom: 30px; object-fit: cover; }
        .login-screen h1 { font-size: 3.5rem; font-weight: 900; background: linear-gradient(45deg, #ff0000, #ffd700, #ff0000); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 4s ease-in-out infinite alternate; letter-spacing: 5px; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .login-screen p { color: #aaa; font-size: 1.2rem; margin: 10px 0 30px; }
        .login-btn { background: #5865F2; color: #fff; padding: 14px 40px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .login-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(88,101,242,0.4); }
        
        /* ===== الشريط العلوي لعرض رقم الطلب ===== */
        .order-bar {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ffd700;
            padding: 12px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            color: #fff;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-bar.show { display: flex; }
        .order-bar .order-number { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
        .order-bar .order-actions { display: flex; gap: 10px; }
        .order-bar .order-actions button {
            background: #ff0000; color: #fff; border: none; padding: 5px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .order-bar .order-actions button:hover { transform: scale(1.05); }
        .order-bar .order-actions .save-btn { background: #00ff00; color: #000; }
        .order-bar .order-actions .save-btn:hover { background: #00cc00; }
        
        /* ===== الشريط السفلي ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,0,0,0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 10px;
            z-index: 1000;
        }
        .bottom-nav a {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .bottom-nav a i { font-size: 1.4rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #fff; }
        .bottom-nav a.active { color: #ff0000; }
        
        /* ===== البطاقات والخانات ===== */
        .glass-card { background: rgba(20,0,0,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,0,0,0.2); border-radius: 15px; padding: 20px; transition: all 0.3s; }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(255,0,0,0.15); border-color: rgba(255,0,0,0.5); }
        
        .section { padding: 20px 15px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 2rem; font-weight: 900; color: #ff0000; text-align: center; margin-bottom: 20px; }
        
        /* ===== خانات المتجر الرئيسية (من برا) ===== */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .store-card {
            border-radius: 15px;
            padding: 25px 20px;
            transition: all 0.3s;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 0 15px rgba(0,0,0,0.9);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
            background-size: cover;
            background-position: center;
        }
        .store-card:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .store-card h2 { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        .store-card p { font-size: 1rem; opacity: 0.9; }
        
        /* خلفيات الخانات الرئيسية (من برا) */
        .card-realestate {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536078658274336988/Screenshot_------_com.openai.chatgpt.png?ex=6a7a183b&is=6a78c6bb&hm=ab0c5102d75c125c99686d438b39d359c40b65c00c836c39a3ca1f9c12ead26c&');
            background-size: cover; background-position: center;
        }
        .card-packages {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536081379090104442/Screenshot_------_com.openai.chatgpt-3.png?ex=6a7a1ac3&is=6a78c943&hm=57b2c057d3849a568a3a8c48bc9ebc102234d4c868d91ae8f0a8b8345a41616c&');
            background-size: cover; background-position: center;
        }
        .card-gangs {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536081378695716934/Screenshot_------_com.openai.chatgpt-2.png?ex=6a7a1ac3&is=6a78c943&hm=f4039a3e0e65b8769d86d3928eb5a398f143905be9b0bdbf4aa01361c7ddb93c&');
            background-size: cover; background-position: center;
        }
        
        /* ===== خانات المنتجات الداخلية ===== */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .product-card {
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        .product-card:hover { transform: translateY(-5px); border-color: #ffd700; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .product-card .price { color: #ffd700; font-size: 1.2rem; font-weight: 700; }
        .product-card button { background: #ff0000; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .product-card button:hover { background: #cc0000; transform: scale(1.05); }
        
        /* خلفيات المنتجات الداخلية */
        .bg-realestate-inner {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536078658274336988/Screenshot_------_com.openai.chatgpt.png?ex=6a7a183b&is=6a78c6bb&hm=ab0c5102d75c125c99686d438b39d359c40b65c00c836c39a3ca1f9c12ead26c&');
            background-size: cover; background-position: center;
        }
        .bg-packages-inner {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536081379090104442/Screenshot_------_com.openai.chatgpt-3.png?ex=6a7a1ac3&is=6a78c943&hm=57b2c057d3849a568a3a8c48bc9ebc102234d4c868d91ae8f0a8b8345a41616c&');
            background-size: cover; background-position: center;
        }
        .bg-gangs-inner {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1536081378695716934/Screenshot_------_com.openai.chatgpt-2.png?ex=6a7a1ac3&is=6a78c943&hm=f4039a3e0e65b8769d86d3928eb5a398f143905be9b0bdbf4aa01361c7ddb93c&');
            background-size: cover; background-position: center;
        }
        
        /* ===== وزارات ===== */
        .ministry-card { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255,0,0,0.2); border-radius: 12px; padding: 20px; text-align: center; transition: all 0.3s; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .ministry-card:hover { transform: scale(1.03); border-color: #ff0000; }
        .ministry-card img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ff0000; margin-bottom: 10px; object-fit: cover; }
        .ministry-card .closed { color: #ff0000; font-weight: 700; margin-top: 10px; font-size: 0.9rem; }
        
        /* ===== الإدارة ===== */
        .admin-card { background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); border: 1px solid rgba(255,0,0,0.2); border-radius: 12px; padding: 20px; text-align: center; transition: all 0.3s; }
        .admin-card .rank { color: #ff0000; font-weight: 700; font-size: 0.9rem; }
        .admin-card .name { font-size: 1.3rem; font-weight: 700; }
        
        /* ===== القوانين ===== */
        .law-item { border-right: 3px solid #ff0000; padding-right: 15px; margin-bottom: 12px; }
        
        /* ===== السلة ===== */
        .cart-sidebar { position: fixed; top: 0; left: -400px; width: 380px; height: 100%; background: rgba(10,0,0,0.95); backdrop-filter: blur(15px); border-right: 2px solid #ff0000; padding: 20px; z-index: 1000; transition: all 0.4s ease; overflow-y: auto; }
        .cart-sidebar.open { left: 0; }
        .cart-sidebar .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 15px; margin-bottom: 15px; }
        .cart-sidebar .cart-header h3 { color: #ffd700; font-size: 1.5rem; }
        .cart-sidebar .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-sidebar .cart-item .item-name { color: #fff; }
        .cart-sidebar .cart-item .item-price { color: #ffd700; }
        .cart-sidebar .cart-total { color: #ffd700; font-size: 1.3rem; font-weight: 700; padding: 15px 0; border-top: 2px solid rgba(255,0,0,0.3); margin-top: 15px; }
        
        .cart-toggle { position: fixed; bottom: 90px; right: 20px; background: #ff0000; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 30px rgba(255,0,0,0.4); transition: all 0.3s; z-index: 500; }
        .cart-toggle:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(255,0,0,0.6); }
        .cart-toggle .badge { position: absolute; top: -5px; right: -5px; background: #ffd700; color: #000; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; font-weight: 700; display: flex; justify-content: center; align-items: center; }
        
        /* ===== إخفاء العناصر ===== */
        .hidden { display: none; }
        
        /* ===== إشعارات ===== */
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes fadeOutDown { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(30px); } }
        
        /* ===== استجابة للهواتف ===== */
        @media (max-width: 768px) {
            .login-screen h1 { font-size: 2.5rem; }
            .section-title { font-size: 1.8rem; }
            .cart-sidebar { width: 100%; left: -100%; }
            .bottom-nav a { font-size: 0.6rem; }
            .bottom-nav a i { font-size: 1.2rem; }
            .order-bar { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="loginScreen" class="login-screen bg-main">
    <div class="content text-center">
        <img class="logo" src="https://cdn.discordapp.com/attachments/1259131362615492658/1536081187112616086/file_0000000075ec81f4a2f598e0a37d13f8.png?ex=6a7a1a96&is=6a78c916&hm=d5e9dba92e8f19f99c21d3f807a1acb9149689193411752f0dec9ed14585738c&" alt="Arab Land">
        <h1>ARAB LAND</h1>
        <p>سيرفر رول بلاي فريد من نوعه</p>
        <button class="login-btn" onclick="loginWithDiscord()">
            <i class="fab fa-discord"></i> سجل دخولك عبر ديسكورد
        </button>
    </div>
</div>

<!-- ===== الموقع الرئيسي ===== -->
<div id="mainSite" style="display:none;" class="bg-main">
    <div class="content">
        
        <!-- ===== شريط عرض رقم الطلب ===== -->
        <div id="orderBar" class="order-bar">
            <span class="order-number" id="orderNumberDisplay">📋 رقم الطلب: <span id="orderNumberText">0</span></span>
            <div class="order-actions">
                <button class="save-btn" onclick="saveOrderNumber()">💾 حفظ</button>
                <button onclick="removeOrderNumber()">🗑️ إزالة</button>
            </div>
        </div>
        
        <!-- ===== المحتوى ===== -->
        <div id="pageContent"></div>
        
        <!-- ===== الشريط السفلي ===== -->
        <nav class="bottom-nav" id="bottomNav">
            <a href="#" class="active" data-page="home">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="#" data-page="store">
                <i class="fas fa-store"></i>
                <span>المتجر</span>
            </a>
            <a href="#" data-page="jobs">
                <i class="fas fa-briefcase"></i>
                <span>الوظائف</span>
            </a>
            <a href="#" data-page="admin">
                <i class="fas fa-crown"></i>
                <span>الإدارة</span>
            </a>
            <a href="#" data-page="rules">
                <i class="fas fa-gavel"></i>
                <span>القوانين</span>
            </a>
            <a href="#" onclick="logout()">
                <i class="fas fa-sign-out-alt" style="color:#ff0000;"></i>
                <span style="color:#ff0000;">خروج</span>
            </a>
        </nav>
        
    </div>
</div>

<!-- ===== زر السلة ===== -->
<button class="cart-toggle" onclick="toggleCart()">
    🛒
    <span class="badge" id="cartBadge">0</span>
</button>

<!-- ===== شريط السلة ===== -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3>🛒 سلة المشتريات</h3>
        <button onclick="toggleCart()" style="background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">✕</button>
    </div>
    <div id="cartItems"><p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p></div>
    <div class="cart-total" id="cartTotal">المجموع: 0 كريدت</div>
    <button onclick="checkout()" style="width:100%;background:#00ff00;color:#000;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:10px;">✅ إنهاء الطلب</button>
</div>

<script>
    // ===== نظام عرض رقم الطلب =====
    let currentOrderNumber = '';
    
    function showOrderNumber(number) {
        currentOrderNumber = number;
        document.getElementById('orderNumberText').textContent = number;
        document.getElementById('orderBar').classList.add('show');
        // حفظ في localStorage
        localStorage.setItem('lastOrderNumber', number);
    }
    
    function saveOrderNumber() {
        if (currentOrderNumber) {
            // حفظ الرقم في مكان آمن (مثل localStorage)
            localStorage.setItem('savedOrderNumber', currentOrderNumber);
            showNotification('✅ تم حفظ رقم الطلب: #' + currentOrderNumber);
        }
    }
    
    function removeOrderNumber() {
        currentOrderNumber = '';
        document.getElementById('orderBar').classList.remove('show');
        localStorage.removeItem('lastOrderNumber');
        showNotification('🗑️ تم إزالة رقم الطلب');
    }
    
    // استرجاع الرقم المحفوظ سابقاً
    const savedOrder = localStorage.getItem('lastOrderNumber');
    if (savedOrder) {
        showOrderNumber(savedOrder);
    }
    
    // ===== تسجيل الدخول =====
    function loginWithDiscord() {
        const mockUser = {
            username: 'CJ',
            avatar: 'https://cdn.discordapp.com/attachments/1259131362615492658/1536082889974743100/Screenshot_------_com.openai.chatgpt-6.png?ex=6a7a1c2c&is=6a78caac&hm=abf5c6b3a5d5ecf954bd09e430d12fabb85805fe48bae293cf9c37e9a3d89119&',
            id: '123456789'
        };
        localStorage.setItem('user', JSON.stringify(mockUser));
        showMainSite(mockUser);
    }
    
    function showMainSite(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainSite').style.display = 'block';
        loadPage('home');
    }
    
    function logout() {
        localStorage.removeItem('user');
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainSite').style.display = 'none';
    }
    
    // ===== تحميل الصفحات =====
    function loadPage(page) {
        const content = document.getElementById('pageContent');
        const pages = { home: getHomePage, store: getStorePage, jobs: getJobsPage, admin: getAdminPage, rules: getRulesPage };
        if (pages[page]) {
            content.innerHTML = pages[page]();
            document.querySelectorAll('.bottom-nav a[data-page]').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) link.classList.add('active');
            });
            if (page === 'store') {
                setTimeout(() => { updateCartUI(); }, 100);
            }
        }
    }
    
    document.querySelectorAll('.bottom-nav a[data-page]').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            loadPage(this.dataset.page);
        });
    });
    
    // ===== الصفحات =====
    function getHomePage() {
        const user = JSON.parse(localStorage.getItem('user') || '{"username":"CJ"}');
        return `
            <section class="section">
                <div class="glass-card text-center" style="max-width:800px;margin:0 auto;">
                    <img src="https://cdn.discordapp.com/attachments/1259131362615492658/1536082889974743100/Screenshot_------_com.openai.chatgpt-6.png?ex=6a7a1c2c&is=6a78caac&hm=abf5c6b3a5d5ecf954bd09e430d12fabb85805fe48bae293cf9c37e9a3d89119&" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:20px;">
                    <h2 style="color:#ff0000;font-size:2.5rem;">ARAB LAND</h2>
                    <p style="color:#ffd700;font-size:1.2rem;">مرحباً بك، ${user.username}</p>
                    <p style="color:#aaa;font-size:1.2rem;margin-top:10px;">🌴 حياكم الله في جزيرة العرب 🌴</p>
                    <div style="margin-top:20px;"><span class="status-badge status-online" style="display:inline-block;padding:4px 12px;border-radius:20px;background:#00ff00;color:#000;font-weight:700;">🟢 المتجر مفتوح</span></div>
                </div>
            </section>
        `;
    }
    
    // ===== صفحة المتجر =====
    function getStorePage() {
        return `
            <section class="section">
                <h2 class="section-title">🛍️ المنتجات</h2>
                <div class="store-grid">
                    <div class="store-card card-realestate" onclick="showCategory('realestate')">
                        <h2 style="color:#00ff00;">🏠 العقارات</h2>
                        <p>شقق، محلات، بيوت، قصور</p>
                    </div>
                    <div class="store-card card-packages" onclick="showCategory('packages')">
                        <h2 style="color:#ffd700;">🎁 الحزم</h2>
                        <p>سيارات، VIP، مزايا حصرية</p>
                    </div>
                    <div class="store-card card-gangs" onclick="showCategory('gangs')">
                        <h2 style="color:#ff0000;">⚔️ العصابات</h2>
                        <p>تأسيس، تطوير، تسليح</p>
                    </div>
                </div>
                
                <!-- العقارات -->
                <div id="realestateProducts" class="hidden" style="margin-top:30px;">
                    <h3 style="color:#00ff00;font-size:1.8rem;text-align:center;">🏠 العقارات</h3>
                    <div class="product-grid">
                        ${getProducts('realestate')}
                    </div>
                    <button onclick="hideCategory('realestateProducts')" style="margin-top:10px;background:transparent;border:1px solid #ff0000;color:#ff0000;padding:8px 20px;border-radius:8px;cursor:pointer;">⬅️ رجوع</button>
                </div>
                
                <!-- الحزم -->
                <div id="packagesProducts" class="hidden" style="margin-top:30px;">
                    <h3 style="color:#ffd700;font-size:1.8rem;text-align:center;">🎁 الحزم</h3>
                    <div class="product-grid">
                        ${getProducts('packages')}
                    </div>

    // ===== نظام السلة =====
    let cart = [];
    let cartCount = 0;
    
    function addToCart(name, price) {
        const existing = cart.find(item => item.name === name);
        if (existing) { existing.quantity += 1; } else { cart.push({ name, price, quantity: 1 }); }
        cartCount += 1;
        updateCartUI();
        showNotification('✅ تم إضافة "' + name + '" إلى السلة!');
    }
    
    function removeFromCart(index) {
        cartCount -= cart[index].quantity;
        cart.splice(index, 1);
        updateCartUI();
    }
    
    function updateCartUI() {
        const itemsContainer = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotal');
        const badge = document.getElementById('cartBadge');
        badge.textContent = cartCount;
        if (cart.length === 0) {
            itemsContainer.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p>';
            totalEl.textContent = 'المجموع: 0 كريدت';
            return;
        }
        let html = '', total = 0;
        cart.forEach((item, index) => {
            total += item.price * item.quantity;
            html += `
                <div class="cart-item">
                    <div><div class="item-name">${item.name}</div><div style="color:#888;font-size:0.8rem;">الكمية: ${item.quantity}</div></div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="item-price">${(item.price * item.quantity).toLocaleString()} ك</span>
                        <button onclick="removeFromCart(${index})" style="background:transparent;border:none;color:#ff0000;cursor:pointer;font-size:1.2rem;">✕</button>
                    </div>
                </div>
            `;
        });
        itemsContainer.innerHTML = html;
        totalEl.textContent = 'المجموع: ' + total.toLocaleString() + ' كريدت';
    }
    
    function toggleCart() {
        document.getElementById('cartSidebar').classList.toggle('open');
    }
    
    function checkout() {
        if (cart.length === 0) {
            showNotification('⚠️ السلة فارغة! أضف منتجات أولاً.', 'error');
            return;
        }
        const orderNumber = Date.now().toString().slice(-6) + Math.floor(Math.random() * 9000 + 1000);
        // عرض رقم الطلب في الشريط العلوي
        showOrderNumber(orderNumber);
        
        let orderText = '🛍️ **طلب جديد من متجر Arab Land**\n📋 **رقم الطلب:** #' + orderNumber + '\n\n';
        let total = 0;
        cart.forEach(item => {
            orderText += '- ' + item.name + ' (' + item.quantity + 'x) - ' + (item.price * item.quantity).toLocaleString() + ' كريدت\n';
            total += item.price * item.quantity;
        });
        orderText += '\n💰 **الإجمالي:** ' + total.toLocaleString() + ' كريدت';
        orderText += '\n\n📌 يرجى التوجه إلى تكت المتجر في الديسكورد لاستلام الطلب';
        
        fetch('https://discord.com/api/webhooks/1536050582245081228/kFbbq1v92r15IC92OlfAkXjXQODCGJ68d73Ztp56IUThZVN19UPgAYIclu9jTmN13M9d', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: orderText })
        })
        .then(res => {
            if (res.ok) {
                showNotification('✅ تم إرسال طلبك بنجاح! رقم الطلب: #' + orderNumber);
                cart = [];
                cartCount = 0;
                updateCartUI();
                toggleCart();
            } else {
                showNotification('❌ فشل الإرسال، تأكد من إعدادات الـ Webhook.', 'error');
            }
        })
        .catch(() => showNotification('⚠️ خطأ في الشبكة.', 'error'));
    }
    
    function showNotification(message, type = 'success') {
        const colors = { success: '#00ff00', error: '#ff0000', warning: '#ffd700' };
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: #fff; padding: 15px 30px;
            border-radius: 12px; border: 2px solid ${colors[type] || '#ffd700'};
            z-index: 2000; font-weight: 700; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: fadeInUp 0.4s ease;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.animation = 'fadeOutDown 0.4s ease';
            setTimeout(() => notification.remove(), 400);
        }, 3000);
    }
    
    // ===== تحميل المستخدم المحفوظ =====
    const savedUser = localStorage.getItem('user');
    if (savedUser) { showMainSite(JSON.parse(savedUser)); }
